<style>
  :root{
    --bg: #14261F;
    --bg-card: #1D3229;
    --bg-card-2: #223A2F;
    --cream: #F2ECDD;
    --cream-dim: #B9C4B8;
    --gold: #D7A73C;
    --bi: #C9633F;   /* Kirundi = terre / argile */
    --bi-bg: rgba(201,99,63,0.14);
    --rw: #4FA3A8;   /* Kinyarwanda = lac */
    --rw-bg: rgba(79,163,168,0.14);
    --danger: #C9633F;
    --ok: #7FAE6A;
    --radius: 18px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--cream); font-family:'IBM Plex Sans',sans-serif; min-height:100vh;}
  #app{max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; padding-bottom:90px; position:relative;}

  .topbar{padding:22px 20px 14px; display:flex; align-items:baseline; justify-content:space-between;}
  .topbar h1{font-family:'Fraunces',serif; font-weight:700; font-size:28px; margin:0; letter-spacing:0.5px;}
  .topbar .sub{font-size:12px; color:var(--cream-dim); letter-spacing:1.5px; text-transform:uppercase;}

  .lang-tag{display:inline-block; font-size:11px; font-weight:600; padding:3px 8px; border-radius:20px; letter-spacing:0.5px;}
  .tag-bi{background:var(--bi-bg); color:var(--bi);}
  .tag-rw{background:var(--rw-bg); color:var(--rw);}

  .screen{padding:0 20px; flex:1; animation:fade .25s ease;}
  @keyframes fade{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}

  .stat-row{display:flex; gap:12px; margin:10px 0 22px;}
  .stat{flex:1; background:var(--bg-card); border-radius:var(--radius); padding:16px; text-align:center;}
  .stat .num{font-family:'Fraunces',serif; font-size:30px; font-weight:600; color:var(--gold); display:block;}
  .stat .lbl{font-size:11px; color:var(--cream-dim); text-transform:uppercase; letter-spacing:1px;}

  .menu-card{background:var(--bg-card); border-radius:var(--radius); padding:20px; margin-bottom:14px; display:flex; align-items:center; justify-content:space-between; cursor:pointer; border:1px solid rgba(255,255,255,0.04); transition:transform .15s ease, background .15s ease;}
  .menu-card:active{transform:scale(0.98); background:var(--bg-card-2);}
  .menu-card .mc-title{font-family:'Fraunces',serif; font-size:19px; font-weight:600;}
  .menu-card .mc-desc{font-size:12.5px; color:var(--cream-dim); margin-top:3px;}
  .menu-card .mc-arrow{font-size:22px; color:var(--gold);}

  .cat-row{display:flex; gap:8px; overflow-x:auto; padding:4px 0 16px; -ms-overflow-style:none; scrollbar-width:none;}
  .cat-row::-webkit-scrollbar{display:none;}
  .chip{flex:0 0 auto; background:var(--bg-card); color:var(--cream-dim); border:1px solid rgba(255,255,255,0.06); padding:8px 14px; border-radius:20px; font-size:13px; cursor:pointer; white-space:nowrap;}
  .chip.active{background:var(--gold); color:#1D2B1F; font-weight:600; border-color:var(--gold);}
  .lvl-chip{font-size:12px; opacity:0.65;}
  .lvl-chip.active{opacity:1;}
  .theme-row{display:flex; gap:8px; overflow-x:auto; padding:4px 0 10px; -ms-overflow-style:none; scrollbar-width:none;}
  .theme-row::-webkit-scrollbar{display:none;}
  .theme-chip{flex:0 0 auto; background:var(--bg-card-2); color:var(--cream); border:1px solid rgba(255,255,255,0.08); padding:10px 16px; border-radius:16px; font-size:13.5px; cursor:pointer; white-space:nowrap; font-weight:500;}
  .theme-chip.active{background:var(--gold); color:#1D2B1F; font-weight:700; border-color:var(--gold);}
  .filter-label{font-size:11px; color:var(--cream-dim); text-transform:uppercase; letter-spacing:1px; margin:14px 0 6px;}
  .legend-star{font-size:11.5px; color:var(--cream-dim); font-style:italic; padding:12px 4px 6px; line-height:1.4;}
  .starmark{color:var(--gold); font-weight:700;}
  .lvl-badge{display:inline-block; padding:2px 9px; border-radius:10px; font-size:10.5px; font-weight:700; margin-left:8px; vertical-align:middle; letter-spacing:0.3px;}
  .lvl-badge.lvl-1{background:rgba(127,174,106,0.18); color:#7FAE6A;}
  .lvl-badge.lvl-2{background:rgba(215,167,60,0.18); color:#D7A73C;}
  .lvl-badge.lvl-3{background:rgba(224,149,74,0.18); color:#E0954A;}
  .lvl-badge.lvl-4{background:rgba(201,80,74,0.18); color:#C9504A;}
  .breadcrumb{font-size:11.5px; color:var(--cream-dim); padding:14px 0 0; display:flex; align-items:center; flex-wrap:wrap; gap:2px;}
  .breadcrumb .crumb{opacity:0.85;}
  .breadcrumb .crumb-link{cursor:pointer; text-decoration:underline; text-decoration-color:rgba(185,196,184,0.35);}
  .breadcrumb .crumb-sep{margin:0 6px; opacity:0.4;}
  .pending-badge{display:inline-block; padding:2px 8px; border-radius:8px; font-size:10px; font-weight:600; margin-left:6px; background:transparent; color:var(--cream-dim); border:1px dashed rgba(185,196,184,0.5);}

  .compare-card{background:var(--bg-card); border-radius:var(--radius); padding:18px; margin-bottom:12px;}
  .compare-card .fr{font-size:16px; color:var(--cream); margin-bottom:12px; font-weight:500;}
  .compare-line{display:flex; align-items:flex-start; gap:10px; padding:8px 0;}
  .compare-line + .compare-line{border-top:1px solid rgba(255,255,255,0.06);}
  .compare-line .txt{font-family:'Fraunces',serif; font-size:17px;}
  .compare-line .flag{font-size:10px; color:var(--cream-dim); font-style:italic; margin-top:2px;}

  .flash-wrap{display:flex; flex-direction:column; align-items:center; padding-top:10px;}
  .progress-bar{width:100%; height:5px; background:var(--bg-card); border-radius:4px; overflow:hidden; margin-bottom:22px;}
  .progress-fill{height:100%; background:var(--gold); transition:width .2s ease;}
  .flash-card{width:100%; background:var(--bg-card); border-radius:22px; padding:34px 22px; min-height:220px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:10px;}
  .flash-card .cat-eyebrow{font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--cream-dim); margin-bottom:6px;}
  .flash-fr{font-family:'Fraunces',serif; font-size:26px; font-weight:600; line-height:1.3;}
  .flash-answers{margin-top:14px; width:100%; display:flex; flex-direction:column; gap:10px;}
  .ans-row{border-radius:14px; padding:14px 16px; text-align:left;}
  .ans-row.bi{background:var(--bi-bg);}
  .ans-row.rw{background:var(--rw-bg);}
  .ans-row .lbl{font-size:10px; font-weight:700; letter-spacing:1px; text-transform:uppercase; margin-bottom:4px;}
  .ans-row.bi .lbl{color:var(--bi);}
  .ans-row.rw .lbl{color:var(--rw);}
  .ans-row .word{font-family:'Fraunces',serif; font-size:19px;}
  .ans-row .flag{font-size:11px; color:var(--cream-dim); font-style:italic; margin-top:3px;}

  .tap-hint{margin-top:20px; font-size:13px; color:var(--cream-dim);}
  .rate-row{display:flex; gap:10px; width:100%; margin-top:22px;}
  .rate-btn{flex:1; padding:14px 0; border-radius:14px; border:none; font-size:14px; font-weight:600; font-family:'IBM Plex Sans',sans-serif; cursor:pointer;}
  .rate-hard{background:rgba(201,99,63,0.18); color:var(--bi);}
  .rate-ok{background:rgba(215,167,60,0.18); color:var(--gold);}
  .rate-easy{background:rgba(127,174,106,0.18); color:var(--ok);}

  .timer-ring{width:74px; height:74px; border-radius:50%; border:4px solid var(--bg-card-2); border-top-color:var(--gold); animation:spin 3s linear; margin-bottom:16px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .timer-num{font-family:'Fraunces',serif; font-size:36px; color:var(--gold); margin-bottom:10px;}

  .done-wrap{text-align:center; padding-top:60px;}
  .done-wrap .big{font-size:44px;}
  .done-wrap h2{font-family:'Fraunces',serif; margin:14px 0 6px;}
  .done-wrap p{color:var(--cream-dim); font-size:14px;}

  .backbar{display:flex; align-items:center; gap:10px; padding:14px 20px 6px;}
  .backbtn{background:none; border:none; color:var(--cream-dim); font-size:22px; cursor:pointer; padding:4px 8px 4px 0;}
  .backbar h2{font-family:'Fraunces',serif; font-size:20px; margin:0;}

  .primary-btn{width:100%; padding:16px; border-radius:14px; background:var(--gold); color:#1D2B1F; border:none; font-weight:700; font-size:15px; font-family:'IBM Plex Sans',sans-serif; cursor:pointer; margin-top:24px;}
  .primary-btn:active{transform:scale(0.98);}

  .bottomnav{position:fixed; bottom:0; left:0; right:0; max-width:480px; margin:0 auto; background:var(--bg-card); display:flex; border-top:1px solid rgba(255,255,255,0.06); padding:8px 0 max(8px, env(safe-area-inset-bottom));}
  .nav-btn{flex:1; text-align:center; background:none; border:none; color:var(--cream-dim); font-size:11px; padding:8px 0; cursor:pointer; font-family:'IBM Plex Sans',sans-serif;}
  .nav-btn .ic{font-size:18px; display:block; margin-bottom:2px;}
  .nav-btn.active{color:var(--gold);}
</style>
</head>

  if(state.langMode==='bi') return !!p.bi;
  if(state.langMode==='rw') return !!p.rw;
  return true;
}
function phrasesForMode(){
  return PHRASES.filter(p=>langAvailable(p) && levelOk(p) && tenseOk(p));
}

function todayTs(){ return Date.now(); }

async function loadProgress(){
  try{
    const raw = localStorage.getItem('amakuru-progress-all');
    state.progress = raw ? JSON.parse(raw) : {};
  }catch(e){ state.progress = {}; }
  try{
    const m = localStorage.getItem('amakuru-lang-mode');
    if(m) state.langMode = m;
  }catch(e){ /* default 'both' */ }
}
function setLangMode(mode){
  state.langMode = mode;
  try{ localStorage.setItem('amakuru-lang-mode', mode); }catch(e){ console.error(e); }
}
async function saveProgress(){
  try{ localStorage.setItem('amakuru-progress-all', JSON.stringify(state.progress)); }
  catch(e){ console.error('save failed', e); }
}
function getProg(id){
  if(!state.progress[id]) state.progress[id] = {box:1, due:0};
  return state.progress[id];
}
function dueIds(){
  const now = todayTs();
  return phrasesForMode().filter(p=>{
    const pr = getProg(p.id);
    return pr.due <= now;
  }).map(p=>p.id);
}
function dueCountForCat(cat){
  const now = todayTs();
  return PHRASES.filter(p=>p.cat===cat && langAvailable(p) && levelOk(p) && tenseOk(p) && getProg(p.id).due<=now).length;
}
function totalCountForCat(cat){
  return PHRASES.filter(p=>p.cat===cat && langAvailable(p) && levelOk(p) && tenseOk(p)).length;
}
function rate(id, level){
  // level: 0 hard (reset), 1 ok (+1 box), 2 easy (+2 box)
  const pr = getProg(id);
  if(level===0) pr.box = 1;
  else pr.box = Math.min(6, pr.box + (level===2?2:1));
  const days = [0,0,1,2,4,8,16][pr.box] || 30;
  pr.due = todayTs() + days*24*60*60*1000;
  saveProgress();
}

const SESSION_CAP = 12; // taille max d'une session pour ne pas trop l'allonger

function shuffle(arr){ return arr.slice().sort(()=>Math.random()-0.5); }

// Tirage stratifié par personne (1s/2s/3s/1p/2p/3p) : garantit un mélange
// de toutes les personnes plutôt qu'un hasard pur qui pourrait en oublier.
function stratifiedByPerson(ids, cap){
  const groups = {};
  ids.forEach(id=>{
    const p = PHRASES.find(x=>x.id===id);
    const key = (p && p.person) ? p.person + '_' + (p.polarity || 'aff') + '_' + (p.tense || 'present') : '_none';
    if(!groups[key]) groups[key] = [];
    groups[key].push(id);
  });
  const keys = shuffle(Object.keys(groups));
  keys.forEach(k=>{ groups[k] = shuffle(groups[k]); });
  const result = [];
  let i = 0;
  while(result.length < cap && keys.some(k=>groups[k].length>0)){
    const k = keys[i % keys.length];
    if(groups[k].length>0) result.push(groups[k].shift());
    i++;
  }
  return result;
}

function buildSession(pool, cap){
  if(pool.length===0) return [];
  const hasPersons = pool.some(id=>{
    const p = PHRASES.find(x=>x.id===id);
    return p && p.person;
  });
  return hasPersons ? stratifiedByPerson(pool, cap) : shuffle(pool).slice(0, cap);
}

function startReview(){
  let ids = dueIds();
  if(ids.length===0) ids = phrasesForMode().map(p=>p.id);
  state.session = buildSession(ids, SESSION_CAP);
  state.sIndex = 0;
  state.revealed = false;
  state.reviewCat = null; // révision globale, pas de contexte thème/sous-cat précis
  state.screen = 'review';
}

function startReviewCat(cat){
  const now = todayTs();
  let ids = PHRASES.filter(p=>p.cat===cat && langAvailable(p) && levelOk(p) && tenseOk(p) && getProg(p.id).due<=now).map(p=>p.id);
  if(ids.length===0) ids = PHRASES.filter(p=>p.cat===cat && langAvailable(p) && levelOk(p) && tenseOk(p)).map(p=>p.id);
  state.session = buildSession(ids, SESSION_CAP);
  state.sIndex = 0;
  state.revealed = false;
  state.reviewCat = cat;
  state.screen = 'review';
}

  const body = wrap.querySelector('#tacBody');
  if(!state.revealed){
    body.innerHTML = `<div class="timer-ring"></div><div class="tap-hint">Réagissez à voix haute, la réponse arrive...</div>`;
    if(state.timerId) clearTimeout(state.timerId);
    state.timerId = setTimeout(()=>{ state.revealed = true; render(); }, 3000);
  } else {
    body.innerHTML = answersHtml(p);
    const rateEl = el(`<div class="rate-row">
      <button class="rate-btn rate-hard" data-lvl="0">J'ai bloqué</button>
      <button class="rate-btn rate-easy" data-lvl="2">Réagi vite</button>
    </div>`);
    rateEl.querySelectorAll('button').forEach(b=>{
      b.addEventListener('click', ()=>{
        rate(p.id, parseInt(b.dataset.lvl));
        state.sIndex++;
        state.revealed = false;
        render();
      });
    });
    wrap.querySelector('#rateHolder').replaceWith(rateEl);
  }
  return wrap;
}

// --- ACCORD ADJECTIF/DÉTERMINANT — PILOTE EXPÉRIMENTAL (kinyarwanda uniquement) ---
// Accord de classe nominale umu-/aba- (personnes) : l'adjectif prend un préfixe qui
// s'accorde au nom (mu- au singulier, ba- au pluriel). Base commune de grammaire bantoue.
// Volontairement limité à CETTE SEULE classe nominale, déjà partiellement validée :
// on varie le nom et l'adjectif thématiquement, mais sans introduire de nouvelle classe
// (fruits, véhicules, etc. suivent des règles d'accord différentes, non vérifiées ici).
const ACCORD_EXERCISES = [
  {theme:"bases", fr:"Un enfant gentil / beau", prefix:"Umwana", correct:"mwiza", choices:["mwiza","munini","muto"], explain:"mwiza = accord singulier (classe umu-) de -iza (beau/bon)"},
  {theme:"bases", fr:"Un gros / grand enfant (corpulence)", prefix:"Umwana", correct:"munini", choices:["muto","munini","mubi"], explain:"munini = accord singulier de -nini (gros, grand en taille/volume — pas la hauteur)"},
  {theme:"bases", fr:"Un petit enfant", prefix:"Umwana", correct:"muto", choices:["muto","banini","mwiza"], explain:"muto = accord singulier de -to (petit)"},
  {theme:"bases", fr:"Des enfants gentils / beaux", prefix:"Abana", correct:"beza", choices:["beza","bato","banini"], explain:"beza = accord pluriel (classe aba-) de -iza (beau/bon)"},
  {theme:"bases", fr:"De gros / grands enfants (corpulence)", prefix:"Abana", correct:"banini", choices:["banini","mato","beza"], explain:"banini = accord pluriel de -nini (gros, grand en taille/volume)"},
  {theme:"bases", fr:"De petits enfants", prefix:"Abana", correct:"bato", choices:["bato","manini","beza"], explain:"bato = accord pluriel de -to (petit)"},

  // Santé : même classe umu-/aba-, adjectif -zima (en bonne santé/vivant), source Bigirimana
  {theme:"sante", fr:"Un enfant en bonne santé", prefix:"Umwana", correct:"muzima", choices:["muzima","mubi","muto"], explain:"muzima = accord singulier de -zima (en bonne santé, vivant)"},
  {theme:"sante", fr:"Des enfants en bonne santé", prefix:"Abana", correct:"bazima", choices:["bazima","babi","bato"], explain:"bazima = accord pluriel de -zima (en bonne santé, vivants)"},
  {theme:"sante", fr:"Un enfant malade", prefix:"Umwana", correct:"mubi", choices:["mubi","muzima","munini"], explain:"mubi = accord singulier de -bi (mauvais état, ici : pas en forme)"},
  {theme:"sante", fr:"Des enfants malades", prefix:"Abana", correct:"babi", choices:["babi","bazima","banini"], explain:"babi = accord pluriel de -bi (mauvais état)"},

  // Travail : meme classe, nom different (umukozi/abakozi = employe), adjectif -kuru (important/senior), source Bigirimana
  {theme:"travail", fr:"Un employé important / expérimenté", prefix:"Umukozi", correct:"mukuru", choices:["mukuru","muto","mubi"], explain:"mukuru = accord singulier de -kuru (important, senior)"},
  {theme:"travail", fr:"Des employés importants / expérimentés", prefix:"Abakozi", correct:"bakuru", choices:["bakuru","bato","babi"], explain:"bakuru = accord pluriel de -kuru (important, senior)"},
  {theme:"travail", fr:"Un jeune employé", prefix:"Umukozi", correct:"muto", choices:["muto","mukuru","munini"], explain:"muto = accord singulier de -to (jeune/petit)"},
  {theme:"travail", fr:"De jeunes employés", prefix:"Abakozi", correct:"bato", choices:["bato","bakuru","banini"], explain:"bato = accord pluriel de -to (jeune/petit)"},
];

const ACCORD_THEME_LABELS = {bases:"Bases & socialiser", sante:"Santé & urgences", travail:"Travail, études & communication"};

function startAccord(themeKey){
  state.accordTheme = themeKey;
  const pool = ACCORD_EXERCISES.map((_,i)=>i).filter(i=>ACCORD_EXERCISES[i].theme===themeKey);
  state.accordSession = pool.sort(()=>Math.random()-0.5);
  state.accordIndex = 0;
  state.accordScore = 0;
  state.accordSelected = null;
  state.screen = 'accord';
}

function renderAccordSetup(){
  const wrap = el(`<div class="screen">
    <div class="backbar"><h2>Accorder les mots</h2></div>
    <p style="color:var(--cream-dim); font-size:13.5px; margin:0 0 16px;">Pilote expérimental (kinyarwanda, classe des noms de personnes umu-/aba-). Choisis un thème.</p>
    <div id="accordThemeList"></div>
  </div>`);
  const list = wrap.querySelector('#accordThemeList');
  Object.entries(ACCORD_THEME_LABELS).forEach(([key,label])=>{
    const t = THEMES[key];
    const n = ACCORD_EXERCISES.filter(e=>e.theme===key).length;
    const card = el(`<div class="menu-card" data-theme="${key}">
      <div><div class="mc-title">${t.icon} ${label}</div><div class="mc-desc">${n} exercices</div></div>
      <div class="mc-arrow">→</div>
    </div>`);
    card.addEventListener('click', ()=>{ startAccord(key); render(); });
    list.appendChild(card);
  });
  return wrap;
}

function renderAccord(){
  if(state.accordIndex >= state.accordSession.length){
    const wrap = el(`<div class="screen"><div class="done-wrap">
      <div class="big">✓</div>
      <h2>Pilote terminé</h2>
      <p>${state.accordScore} / ${state.accordSession.length} bonnes réponses.</p>
      <p style="font-size:12px; opacity:0.7; margin-top:14px;">Ce mini-exercice ne couvre qu'une seule classe nominale (personnes, umu-/aba-) à titre de test. À valider avec un locuteur natif avant d'étendre à d'autres classes.</p>
      <button class="primary-btn" id="backHome">Retour à l'accueil</button>
    </div></div>`);
    wrap.querySelector('#backHome').addEventListener('click', ()=>{ state.screen='home'; render(); });
    return wrap;
  }
  const ex = ACCORD_EXERCISES[state.accordSession[state.accordIndex]];
  const pct = Math.round((state.accordIndex/state.accordSession.length)*100);
  const wrap = el(`<div class="screen">
    <div class="backbar"><h2>Accorder les mots</h2></div>
    <div class="flash-wrap">
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="flash-card">
        <div class="cat-eyebrow">Pilote — kinyarwanda · ${ACCORD_THEME_LABELS[ex.theme]}</div>
        <div class="flash-fr">${ex.fr}</div>
        <div style="font-family:'Fraunces',serif; font-size:20px; margin-top:6px;">${ex.prefix} <span style="opacity:0.4;">___</span></div>
        <div id="choicesHolder" style="width:100%; display:flex; flex-direction:column; gap:10px; margin-top:18px;"></div>
      </div>
    </div>
  </div>`);
  const holder = wrap.querySelector('#choicesHolder');
  if(state.accordSelected === null){
    ex.choices.forEach(choice=>{
      const btn = el(`<button class="rate-btn" style="background:var(--bg-card-2); color:var(--cream); text-align:center;">${choice}</button>`);
      btn.addEventListener('click', ()=>{
        state.accordSelected = choice;
        if(choice === ex.correct) state.accordScore++;
        render();
      });
      holder.appendChild(btn);
    });
  } else {
    const isCorrect = state.accordSelected === ex.correct;
    holder.appendChild(el(`<div class="ans-row ${isCorrect?'rw':'bi'}">
      <div class="lbl">${isCorrect ? 'Correct !' : 'Pas tout à fait'}</div>
      <div class="word">${ex.prefix} ${ex.correct}</div>
      <div class="flag">${ex.explain}</div>
    </div>`));
    const nextBtn = el(`<button class="primary-btn" style="margin-top:14px;">Suivant</button>`);
    nextBtn.addEventListener('click', ()=>{
      state.accordIndex++;
      state.accordSelected = null;
      render();
    });
    holder.appendChild(nextBtn);
  }
  return wrap;
}

(async function init(){
  try{
    await loadProgress();
    render();
  }catch(e){
    console.error('Amajambo init error:', e);
    const app = document.getElementById('app');
    if(app){
      app.innerHTML = '';
      const box = document.createElement('div');
      box.style.cssText = 'padding:24px;color:#F2ECDD;font-family:sans-serif;';
      box.innerHTML = '<h2 style="margin:0 0 12px;">Oups, une erreur au chargement</h2>'
        + '<p style="opacity:.8;font-size:14px;">Merci de faire une capture d\'écran de ce message et de me l\'envoyer :</p>'
        + '<pre style="white-space:pre-wrap;background:#0006;padding:12px;border-radius:8px;font-size:12px;">'
        + String(e && e.stack ? e.stack : e) + '</pre>';
      app.appendChild(box);
    }
  }
})();
</script>
